<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="蒸馏装置图：圆底烧瓶内置沸石，瓶口温度计水银球与支管口平齐，右侧为直形冷凝管、冷凝水下进上出，冷凝管末端经接液管插入锥形瓶接收。">
  <style>
    .bg { fill: #fbfaf7; }
    .frame { fill: none; stroke: #d9d3c5; stroke-width: 1.5; }
    .t-title { font: 700 17px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-lab { font: 600 12px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2b3742; }
    .t-sub { font: 400 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-key { font: 700 12px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8c2f2c; }
    .glass { fill: #ffffff; stroke: #2b3742; stroke-width: 2.6; stroke-linejoin: round; }
    .glassout { fill: none; stroke: #2b3742; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .tube { fill: none; stroke: #2b3742; stroke-width: 10; stroke-linecap: round; }
    .tubein { fill: none; stroke: #f6f4ef; stroke-width: 4.5; stroke-linecap: round; }
    .water { fill: none; stroke: #2f7fb5; stroke-width: 5; stroke-linecap: round; }
    .lead { fill: none; stroke: #b0413e; stroke-width: 1.4; }
    .liq { fill: #cfe3f2; }
    .liq2 { fill: #d7ebf6; }
  </style>
  <defs>
    <clipPath id="flaskClip"><circle cx="140" cy="250" r="58" /></clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="700" height="400" />
  <rect class="frame" x="0.75" y="0.75" width="698.5" height="398.5" rx="8" />

  <text class="t-title" x="28" y="36">蒸馏装置</text>
  <text class="t-sub" x="28" y="55">直形冷凝管 · 水银球对准支管口 · 冷凝水下进上出 · 锥形瓶接收</text>

  <!-- 圆底烧瓶 + 液体 + 沸石 -->
  <circle class="glass" cx="140" cy="250" r="58" />
  <g clip-path="url(#flaskClip)">
    <rect class="liq" x="82" y="268" width="116" height="40" />
  </g>
  <circle class="glassout" cx="140" cy="250" r="58" />
  <path class="glassout" d="M131 196 L131 108" />
  <path class="glassout" d="M149 196 L149 108" />
  <path class="glassout" d="M125 108 L155 108" />
  <path class="glassout" d="M112 294 l10 -7 l7 9 z" />
  <path class="glassout" d="M136 299 l9 -6 l7 8 z" />
  <path class="glassout" d="M160 292 l10 -6 l6 8 z" />

  <!-- 温度计：水银球与支管口平齐 -->
  <path class="glassout" d="M140 108 L140 66" />
  <circle cx="140" cy="110" r="5.5" fill="#2b3742" />
  <circle cx="140" cy="110" r="10" fill="none" stroke="#b0413e" stroke-width="1.6" stroke-dasharray="3.5 3" />

  <!-- 支管 -->
  <path class="tube" d="M149 120 L200 132" />
  <path class="tubein" d="M152 121 L198 131" />

  <!-- 直形冷凝管 -->
  <path class="glassout" d="M204.7 116.7 L504.7 208.7" />
  <path class="glassout" d="M195.3 147.3 L495.3 239.3" />
  <path class="glassout" d="M204.7 116.7 L195.3 147.3" />
  <path class="glassout" d="M504.7 208.7 L495.3 239.3" />
  <path class="tube" d="M200 132 L500 224" />
  <path class="tubein" d="M200 132 L500 224" />

  <!-- 冷凝水：左端高处为出、右端低处为进 -->
  <path class="water" d="M243.7 128.7 L248.9 111.5" />
  <path class="water" d="M245 109 q11 -7 20 -2" />
  <path class="water" d="M465.7 196.7 L470.9 179.5" />
  <path class="water" d="M464 177 q11 -7 20 -1" />

  <!-- 接液管 -->
  <path class="tube" d="M500 224 C524 246 556 258 556 282 L556 300" />
  <path class="tubein" d="M500 224 C524 246 556 258 556 282 L556 300" />

  <!-- 锥形瓶接收 -->
  <path class="glass" d="M550 300 L562 300 L562 320 L596 384 L516 384 L550 320 Z" />
  <path class="liq2" d="M530 358 L582 358 L596 384 L516 384 Z" />
  <path class="glassout" d="M550 300 L562 300 L562 320 L596 384 L516 384 L550 320 Z" />

  <!-- 极简标注 -->
  <path class="lead" d="M120 110 L132 110" />
  <text class="t-key" x="112" y="114" text-anchor="end">水银球对准支管口</text>

  <path class="lead" d="M254 92 L257 106" />
  <text class="t-lab" x="248" y="86">出（高处）</text>

  <path class="lead" d="M362 124 L362 164" />
  <text class="t-lab" x="330" y="120">直形冷凝管（球形只用于回流）</text>

  <path class="lead" d="M494 188 L478 190" />
  <text class="t-lab" x="500" y="192">进（低处）</text>

  <path class="lead" d="M596 296 L566 302" />
  <text class="t-lab" x="602" y="300">锥形瓶接收</text>

  <path class="lead" d="M140 302 L140 322" />
  <text class="t-lab" x="140" y="338" text-anchor="middle">沸石防暴沸 · 液体占 1/3～2/3</text>
</svg>
