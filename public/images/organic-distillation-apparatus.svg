<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="蒸馏装置图：圆底烧瓶内置温度计，水银球与支管口平齐，右侧为直形冷凝管、冷凝水下进上出，冷凝管末端经接液管插入锥形瓶，瓶内置沸石。">
  <style>
    .bg { fill: #fbfaf7; }
    .frame { fill: none; stroke: #d9d3c5; stroke-width: 1.5; }
    .t-title { font: 700 21px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-sub { font: 400 12.5px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-mark { font: 700 12px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .t-leg { font: 400 13px/1.35 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333d4a; }
    .t-legb { font: 700 13px/1.35 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .glass { fill: none; stroke: #2b3742; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .glassfill { fill: #ffffff; stroke: #2b3742; stroke-width: 2.3; stroke-linejoin: round; }
    .tube { fill: none; stroke: #2b3742; stroke-width: 9; stroke-linecap: round; }
    .tubein { fill: none; stroke: #f6f4ef; stroke-width: 4; stroke-linecap: round; }
    .water { fill: none; stroke: #2f7fb5; stroke-width: 4.5; stroke-linecap: round; }
    .lead { fill: none; stroke: #97a1af; stroke-width: 1.2; }
    .liq { fill: #cfe3f2; }
    .liq2 { fill: #d7ebf6; }
  </style>
  <defs>
    <clipPath id="flaskclip"><circle cx="185" cy="265" r="56" /></clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="660" />
  <rect class="frame" x="0.75" y="0.75" width="958.5" height="658.5" rx="8" />

  <text class="t-title" x="36" y="42">蒸馏装置：管 — 球 — 水 — 石 — 序</text>
  <text class="t-sub" x="36" y="63">改错题按这五字排查，装置图上每一处都有对应的规范说法</text>

  <!-- 圆底烧瓶 -->
  <circle class="glassfill" cx="185" cy="265" r="56" />
  <g clip-path="url(#flaskclip)">
    <rect class="liq" x="129" y="252" width="112" height="69" />
  </g>
  <circle class="glass" cx="185" cy="265" r="56" />
  <path class="glass" d="M177 210 L177 140" />
  <path class="glass" d="M193 210 L193 140" />
  <path class="glass" d="M172 140 L198 140" />

  <!-- 沸石 -->
  <path class="glass" d="M158 310 l9 -6 l6 8 z" />
  <path class="glass" d="M178 315 l8 -5 l7 7 z" />
  <path class="glass" d="M199 309 l9 -5 l5 8 z" />

  <!-- 温度计：水银球与支管口平齐 -->
  <path class="glass" d="M185 140 L185 74" />
  <circle cx="185" cy="150" r="5.5" fill="#2b3742" />
  <circle cx="185" cy="150" r="9" fill="none" stroke="#b0413e" stroke-width="1.4" stroke-dasharray="3 2.5" />

  <!-- 支管 -->
  <path class="tube" d="M193 151 L250 163" />
  <path class="tubein" d="M196 152 L248 162" />

  <!-- 直形冷凝管 -->
  <path class="glass" d="M254.7 147.7 L574.7 246.7" />
  <path class="glass" d="M245.3 178.3 L565.3 277.3" />
  <path class="glass" d="M254.7 147.7 L245.3 178.3" />
  <path class="glass" d="M574.7 246.7 L565.3 277.3" />
  <path class="tube" d="M250 163 L570 262" />
  <path class="tubein" d="M250 163 L570 262" />

  <!-- 冷凝水上出（左端高处）与下进（右端低处） -->
  <path class="water" d="M296.3 160.6 L301.6 143.4" />
  <path class="water" d="M304 141 q10 -6 18 -2" />
  <path class="water" d="M523.5 230.9 L528.8 213.7" />
  <path class="water" d="M516 211 q10 -6 18 -1" />

  <!-- 接液管（牛角管） -->
  <path class="tube" d="M570 262 C594 284 616 296 616 320 L616 352" />
  <path class="tubein" d="M570 262 C594 284 616 296 616 320 L616 352" />

  <!-- 锥形瓶接收 -->
  <path class="glassfill" d="M610 352 L622 352 L622 378 L664 446 L568 446 L610 378 Z" />
  <g>
    <path class="liq2" d="M582 420 L650 420 L664 446 L568 446 Z" />
  </g>
  <path class="glass" d="M610 352 L622 352 L622 378 L664 446 L568 446 L610 378 Z" />
  <path class="glass" d="M606 352 L626 352" />

  <!-- 标记 -->
  <path class="lead" d="M160 150 L174 150" />
  <circle cx="148" cy="150" r="10" fill="#b0413e" />
  <text class="t-mark" x="148" y="154" text-anchor="middle">1</text>

  <path class="lead" d="M420 176 L420 198" />
  <circle cx="420" cy="164" r="10" fill="#3f6ea5" />
  <text class="t-mark" x="420" y="168" text-anchor="middle">2</text>

  <path class="lead" d="M266 186 L290 170" />
  <circle cx="258" cy="192" r="10" fill="#2f7fb5" />
  <text class="t-mark" x="258" y="196" text-anchor="middle">3</text>

  <path class="lead" d="M546 200 L532 210" />
  <circle cx="558" cy="195" r="10" fill="#2f7fb5" />
  <text class="t-mark" x="558" y="199" text-anchor="middle">4</text>

  <path class="lead" d="M118 258 L132 258" />
  <circle cx="104" cy="258" r="10" fill="#6b7280" />
  <text class="t-mark" x="104" y="262" text-anchor="middle">5</text>

  <path class="lead" d="M118 314 L146 314" />
  <circle cx="104" cy="314" r="10" fill="#6b7280" />
  <text class="t-mark" x="104" y="318" text-anchor="middle">6</text>

  <path class="lead" d="M690 420 L666 420" />
  <circle cx="704" cy="420" r="10" fill="#3f6ea5" />
  <text class="t-mark" x="704" y="424" text-anchor="middle">7</text>

  <!-- 图例 -->
  <path d="M36 480 L924 480" stroke="#d9d3c5" stroke-width="1.2" />

  <circle cx="52" cy="506" r="10" fill="#b0413e" />
  <text class="t-mark" x="52" y="510" text-anchor="middle">1</text>
  <text class="t-leg" x="72" y="502">温度计水银球<tspan class="t-legb">与支管口平齐</tspan>，测的是蒸气温度；</text>
  <text class="t-leg" x="72" y="521">插入液面以下测的是过热液体，读数无意义。</text>

  <circle cx="52" cy="548" r="10" fill="#3f6ea5" />
  <text class="t-mark" x="52" y="552" text-anchor="middle">2</text>
  <text class="t-leg" x="72" y="544">蒸馏<tspan class="t-legb">必须用直形冷凝管</tspan>——球形内腔分段、馏分滞留，只配回流；</text>
  <text class="t-leg" x="72" y="563">本图为直形（ Liebig ）管。</text>

  <circle cx="52" cy="590" r="10" fill="#2f7fb5" />
  <text class="t-mark" x="52" y="594" text-anchor="middle">3</text>
  <text class="t-leg" x="72" y="586">冷凝水<tspan class="t-legb">下进上出</tspan>：由右端低处的 4 进、左端高处的 3 出，</text>
  <text class="t-leg" x="72" y="605">保证夹套充满水并与蒸气逆流。</text>

  <circle cx="500" cy="506" r="10" fill="#6b7280" />
  <text class="t-mark" x="500" y="510" text-anchor="middle">5</text>
  <text class="t-leg" x="520" y="502">液体体积占烧瓶 <tspan class="t-legb">1/3 ~ 2/3</tspan>，太多易暴沸、太少需反复补加。</text>

  <circle cx="500" cy="548" r="10" fill="#6b7280" />
  <text class="t-mark" x="500" y="552" text-anchor="middle">6</text>
  <text class="t-leg" x="520" y="544"><tspan class="t-legb">沸石</tspan>防暴沸；忘加必须<tspan class="t-legb">停火冷却至室温</tspan>再补，</text>
  <text class="t-leg" x="520" y="563">热液中丢沸石会带着整瓶液体瞬间冲出的。</text>

  <circle cx="500" cy="590" r="10" fill="#3f6ea5" />
  <text class="t-mark" x="500" y="594" text-anchor="middle">7</text>
  <text class="t-leg" x="520" y="586">用<tspan class="t-legb">锥形瓶</tspan>接收，不用烧杯（敞口大、馏分挥发且难密封）。</text>

  <rect x="36" y="620" width="888" height="28" rx="6" fill="#f4f1e8" stroke="#d9d3c5" stroke-width="1.2" stroke-dasharray="5 4" />
  <text class="t-leg" x="52" y="639" fill="#4b5563">操作顺序：<tspan class="t-legb">先通冷凝水 → 后加热 → 先撤火 → 后停水</tspan>；忘记加沸石时停火、冷却至室温后补加，不可趁热投入。</text>
</svg>
