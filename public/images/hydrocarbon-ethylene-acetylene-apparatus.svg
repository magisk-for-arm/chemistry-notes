<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-label="温度计水银球位置对照：制乙烯量的是反应液温度，温度计水银球插入液面以下；石油蒸馏量的是蒸气温度，水银球与支管口平齐。乙炔由分液漏斗向电石与饱和食盐水中滴加制得，不加热、不需温度计。">
  <style>
    .bg { fill: #fbfaf7; }
    .frame { fill: none; stroke: #d9d3c5; stroke-width: 1.5; }
    .t-title { font: 700 17px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-sub { font: 400 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-row { font: 700 14px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-cond { font: 400 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #55606b; }
    .t-key { font: 700 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8c2f2c; }
    .t-box { font: 600 10.5px/1.35 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e3a52; }
    .glass { fill: #ffffff; stroke: #2b3742; stroke-width: 2.4; stroke-linejoin: round; }
    .glassout { fill: none; stroke: #2b3742; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .gastube { fill: none; stroke: #4a6b8a; stroke-width: 2.6; stroke-linecap: round; }
    .step { fill: #ffffff; stroke: #a8c1da; stroke-width: 1.4; }
    .liq { fill: #cfe3f2; }
    .solid { fill: #d8d3c4; stroke: #6b6a5f; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6b8a" />
    </marker>
    <clipPath id="cA"><circle cx="215" cy="156" r="32" /></clipPath>
    <clipPath id="cB"><circle cx="215" cy="290" r="32" /></clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="700" height="350" />
  <rect class="frame" x="0.75" y="0.75" width="698.5" height="348.5" rx="8" />

  <text class="t-title" x="28" y="36">温度计入不入液面</text>
  <text class="t-sub" x="28" y="55">量反应液温 → 插液面下；量蒸气温度 → 水银球平齐支管口</text>

  <!-- ===== A 乙烯 ===== -->
  <text class="t-row" x="28" y="118">A 乙烯</text>
  <text class="t-cond" x="28" y="136">乙醇 + 浓硫酸 · 170 ℃</text>
  <text class="t-key" x="28" y="156">温度计插液面以下</text>

  <path class="glassout" d="M215 166 L215 84" />
  <circle cx="215" cy="166" r="4.5" fill="#2b3742" />
  <circle cx="215" cy="166" r="9" fill="none" stroke="#b0413e" stroke-width="1.5" stroke-dasharray="3 2.5" />
  <circle class="glass" cx="215" cy="156" r="32" />
  <g clip-path="url(#cA)"><rect class="liq" x="183" y="146" width="64" height="42" /></g>
  <circle class="glassout" cx="215" cy="156" r="32" />
  <path class="glassout" d="M208 128 L208 90" />
  <path class="glassout" d="M222 128 L222 90" />
  <path class="glassout" d="M203 90 L227 90" />
  <path class="glassout" d="M198 178 l7 -5 l5 6 z" />
  <path class="glassout" d="M215 182 l7 -5 l5 6 z" />
  <path class="glassout" d="M232 177 l7 -5 l4 6 z" />
  <path class="gastube" d="M222 98 L278 104" marker-end="url(#ag)" />

  <rect class="step" x="286" y="130" width="118" height="52" rx="6" />
  <text class="t-box" x="296" y="152">NaOH 溶液洗气</text>
  <text class="t-box" x="296" y="169">除 SO₂、CO₂</text>
  <path class="gastube" d="M404 156 L418 156" marker-end="url(#ag)" />
  <rect class="step" x="426" y="130" width="118" height="52" rx="6" />
  <text class="t-box" x="436" y="152">溴的 CCl₄ 溶液</text>
  <text class="t-box" x="436" y="169">检验褪色（加成）</text>
  <path class="gastube" d="M544 156 L558 156" marker-end="url(#ag)" />
  <rect class="step" x="566" y="130" width="118" height="52" rx="6" />
  <text class="t-box" x="576" y="152">排水法收集</text>
  <text class="t-box" x="576" y="169">乙烯难溶于水</text>

  <path d="M28 206 L672 206" stroke="#d9d3c5" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- ===== B 乙炔 ===== -->
  <text class="t-row" x="28" y="248">B 乙炔</text>
  <text class="t-cond" x="28" y="266">电石 + 饱和食盐水</text>
  <text class="t-key" x="28" y="286">分液漏斗控速 · 不加热</text>

  <path class="glassout" d="M201 212 L229 212 L229 222 C229 236 224 244 219 250 L211 250 C206 244 201 236 201 222 Z" />
  <path class="glassout" d="M205 212 L205 206 L225 206 L225 212" />
  <path class="glassout" d="M215 250 L215 264" />
  <path class="glassout" d="M208 250 L222 250" />
  <path class="glassout" d="M222 246 L230 242" />
  <circle class="glass" cx="215" cy="290" r="32" />
  <g clip-path="url(#cB)"><rect class="liq" x="183" y="278" width="64" height="44" /></g>
  <circle class="glassout" cx="215" cy="290" r="32" />
  <path class="glassout" d="M208 264 L208 278" />
  <path class="glassout" d="M222 264 L222 278" />
  <rect class="solid" x="192" y="308" width="17" height="10" rx="2" />
  <rect class="solid" x="211" y="312" width="16" height="10" rx="2" />
  <rect class="solid" x="229" y="306" width="16" height="10" rx="2" />
  <path class="gastube" d="M222 270 L278 276" marker-end="url(#ag)" />

  <rect class="step" x="286" y="264" width="118" height="52" rx="6" />
  <text class="t-box" x="296" y="286">CuSO₄ 溶液洗气</text>
  <text class="t-box" x="296" y="303">除 H₂S、PH₃</text>
  <path class="gastube" d="M404 290 L418 290" marker-end="url(#ag)" />
  <rect class="step" x="426" y="264" width="118" height="52" rx="6" />
  <text class="t-box" x="436" y="286">溴水或 KMnO₄</text>
  <text class="t-box" x="436" y="303">检验褪色</text>
  <path class="gastube" d="M544 290 L558 290" marker-end="url(#ag)" />
  <rect class="step" x="566" y="264" width="118" height="52" rx="6" />
  <text class="t-box" x="576" y="286">排水法收集</text>
  <text class="t-box" x="576" y="303">尾气可燃须点燃</text>

  <text class="t-sub" x="28" y="332">启普发生器三禁：反应剧烈不可停 · 放热易炸裂 · Ca(OH)₂ 糊状堵塞球体</text>
</svg>
