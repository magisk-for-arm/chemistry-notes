<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="乙酸乙酯制备实验装置：分液漏斗按乙醇、浓硫酸、乙酸顺序向圆底烧瓶加料，蒸气经导管导出，导管末端悬在饱和碳酸钠溶液液面上方、与液面留有明显间隙而不插入液面，以防冷却时倒吸。">
  <style>
    .bg { fill: #fbfaf7; }
    .frame { fill: none; stroke: #d9d3c5; stroke-width: 1.5; }
    .t-title { font: 700 17px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-sub { font: 400 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-lab { font: 600 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2b3742; }
    .t-key { font: 700 11.5px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8c2f2c; }
    .glass { fill: #ffffff; stroke: #2b3742; stroke-width: 2.4; stroke-linejoin: round; }
    .glassout { fill: none; stroke: #2b3742; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .gastube { fill: none; stroke: #4a6b8a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .gapmark { fill: none; stroke: #b0413e; stroke-width: 1.8; stroke-dasharray: 4 3; }
    .lead { fill: none; stroke: #b0413e; stroke-width: 1.3; }
    .bubble { fill: none; stroke: #4a6b8a; stroke-width: 1.4; }
    .liq { fill: #cfe3f2; }
    .liq2 { fill: #dbeaf6; }
  </style>
  <defs>
    <clipPath id="eF"><circle cx="120" cy="212" r="48" /></clipPath>
    <clipPath id="eC"><rect x="300" y="186" width="86" height="98" /></clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="700" height="320" />
  <rect class="frame" x="0.75" y="0.75" width="698.5" height="318.5" rx="8" />

  <text class="t-title" x="28" y="36">乙酸乙酯制备</text>
  <text class="t-sub" x="28" y="55">导管末端必须悬空，不能插入液面</text>

  <!-- 分液漏斗（梨形） -->
  <path class="glassout" d="M104 76 L104 68 L136 68 L136 76" />
  <path class="glass" d="M96 76 L144 76 L144 88 C144 106 139 118 133 126 L107 126 C101 118 96 106 96 88 Z" />
  <path class="glassout" d="M104 126 L136 126" />
  <path class="glassout" d="M136 122 L146 117" />
  <path class="glassout" d="M120 126 L120 150" />
  <path class="lead" d="M152 80 L146 82" />
  <text class="t-key" x="158" y="84">分液漏斗：醇 → 硫 → 酸</text>

  <!-- 圆底烧瓶 -->
  <circle class="glass" cx="120" cy="212" r="48" />
  <g clip-path="url(#eF)"><rect class="liq" x="72" y="206" width="96" height="54" /></g>
  <circle class="glassout" cx="120" cy="212" r="48" />
  <path class="glassout" d="M112 150 L112 170" />
  <path class="glassout" d="M128 150 L128 170" />
  <text class="t-lab" x="120" y="280" text-anchor="middle">乙醇 + 浓硫酸 + 乙酸</text>

  <!-- 蒸气导管 -->
  <path class="gastube" d="M128 158 L212 170 L332 180 L332 222" />
  <circle cx="332" cy="222" r="3.2" fill="#4a6b8a" />

  <!-- 饱和 Na2CO3 溶液：液面 246，导管末端 222，留 24px 间隙 -->
  <rect class="glass" x="300" y="186" width="86" height="98" rx="5" />
  <g clip-path="url(#eC)"><rect class="liq2" x="300" y="246" width="86" height="38" /></g>
  <rect class="glassout" x="300" y="186" width="86" height="98" rx="5" />
  <path class="gapmark" d="M320 224 L320 242" />
  <path class="gapmark" d="M316 224 L320 220 L324 224" />
  <path class="gapmark" d="M316 242 L320 246 L324 242" />
  <circle class="bubble" cx="332" cy="256" r="3.2" />
  <circle class="bubble" cx="332" cy="270" r="2.4" />
  <text class="t-lab" x="343" y="302" text-anchor="middle">饱和 Na₂CO₃ 溶液</text>

  <!-- 标注 -->
  <path class="lead" d="M396 216 L340 221" />
  <text class="t-key" x="402" y="220">导管末端悬空</text>
  <text class="t-key" x="402" y="238">不插入液面</text>
  <text class="t-lab" x="402" y="262">否则冷却时倒吸，液体沿导管回流</text>
  <text class="t-lab" x="402" y="280">进灼热的烧瓶引发爆炸</text>
</svg>
