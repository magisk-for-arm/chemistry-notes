<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="乙酸乙酯制备实验装置：分液漏斗向圆底烧瓶中按乙醇、浓硫酸、乙酸的顺序加料，反应产生的蒸气经导管导出，导管末端悬在饱和碳酸钠溶液液面上方而不插入液面，以防倒吸。">
  <style>
    .bg { fill: #fbfaf7; }
    .frame { fill: none; stroke: #d9d3c5; stroke-width: 1.5; }
    .t-title { font: 700 21px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-sub { font: 400 12.5px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-stg { font: 700 13px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e3a52; }
    .t-box { font: 600 12.5px/1.35 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-hint { font: 400 11.5px/1.35 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5a6472; }
    .warndark { fill: #8c2f2c; }
    .t-mark { font: 700 12px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .t-leg { font: 400 13px/1.45 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333d4a; }
    .t-legb { font: 700 13px/1.45 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .glass { fill: #ffffff; stroke: #2b3742; stroke-width: 2.3; stroke-linejoin: round; }
    .glassout { fill: none; stroke: #2b3742; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .gastube { fill: none; stroke: #4a6b8a; stroke-width: 2.6; stroke-linecap: round; }
    .step { fill: #ffffff; stroke: #a8c1da; stroke-width: 1.4; }
    .warn { fill: #fbeceb; stroke: #d9a6a3; stroke-width: 1.5; }
    .gapmark { fill: none; stroke: #b0413e; stroke-width: 2; stroke-dasharray: 4 3; }
    .lead { fill: none; stroke: #97a1af; stroke-width: 1.2; }
    .liq { fill: #cfe3f2; }
    .liq2 { fill: #dbeaf6; }
    .bubble { fill: none; stroke: #4a6b8a; stroke-width: 1.4; }
  </style>
  <defs>
    <clipPath id="e1"><circle cx="150" cy="350" r="50" /></clipPath>
    <clipPath id="e2"><rect x="326" y="320" width="94" height="130" /></clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="580" />
  <rect class="frame" x="0.75" y="0.75" width="958.5" height="578.5" rx="8" />

  <text class="t-title" x="36" y="42">酯化实验：加药序与防倒吸</text>
  <text class="t-sub" x="36" y="63">导管末端必须<tspan font-weight="700" fill="#1b2530">悬在饱和 Na₂CO₃ 溶液液面上方</tspan>而不插入液面——插入即倒吸，冷却时液体沿导管回流进灼热的烧瓶</text>

  <text class="t-stg" x="40" y="98">① 加料：乙醇 → 浓硫酸 → 乙酸</text>
  <text class="t-stg" x="326" y="98">② 尾气：饱和 Na₂CO₃ 溶液</text>
  <text class="t-stg" x="700" y="98">③ 饱和 Na₂CO₃ 的三个作用</text>

  <path class="glassout" d="M120 124 L180 124 L180 138 C180 158 174 170 167 180 L133 180 C126 170 120 158 120 138 Z" />
  <path class="glassout" d="M126 124 L126 112 L174 112 L174 124" />
  <path class="glassout" d="M150 180 L150 240" />
  <path class="glassout" d="M140 180 L160 180" />
  <path class="glassout" d="M160 176 L174 172" />
  <path class="lead" d="M106 140 L118 144" />
  <circle cx="94" cy="138" r="10" fill="#3f6ea5" />
  <text class="t-mark" x="94" y="142" text-anchor="middle">1</text>
  <path class="glassout" d="M138 238 L162 238" />
  <path class="glassout" d="M142 300 L142 240" />
  <path class="glassout" d="M158 300 L158 240" />

  <circle class="glass" cx="150" cy="350" r="50" />
  <g clip-path="url(#e1)"><rect class="liq" x="100" y="336" width="100" height="64" /></g>
  <circle class="glassout" cx="150" cy="350" r="50" />

  <path class="gastube" d="M158 252 L240 246 L350 246 L350 336" />
  <circle cx="350" cy="336" r="3.4" fill="#4a6b8a" />

  <rect class="glass" x="326" y="320" width="94" height="130" rx="5" />
  <g clip-path="url(#e2)"><rect class="liq2" x="326" y="362" width="94" height="88" /></g>
  <rect class="glassout" x="326" y="320" width="94" height="130" rx="5" />
  <path class="gapmark" d="M350 340 L350 358" />
  <circle class="bubble" cx="350" cy="378" r="3.4" />
  <circle class="bubble" cx="350" cy="398" r="2.6" />
  <circle class="bubble" cx="350" cy="416" r="3" />

  <path class="lead" d="M358 346 L436 330" />
  <circle cx="450" cy="326" r="10" fill="#b0413e" />
  <text class="t-mark" x="450" y="330" text-anchor="middle">2</text>
  <rect class="warn" x="466" y="284" width="204" height="96" rx="6" />
  <text class="t-box warndark" x="482" y="310">导管末端悬空</text>
  <text class="t-box warndark" x="482" y="332">与液面之间留有空隙</text>
  <text class="t-hint warndark" x="482" y="356">红色虚线即这段间隙</text>
  <text class="t-hint warndark" x="482" y="374">CO₂ 鼓泡后从液面逸出</text>

  <rect class="step" x="700" y="118" width="224" height="262" rx="7" />
  <circle cx="726" cy="158" r="12" fill="#3f6ea5" />
  <text class="t-mark" x="726" y="162" text-anchor="middle">a</text>
  <text class="t-box" x="750" y="163">吸收挥发出的乙醇</text>
  <circle cx="726" cy="216" r="12" fill="#3f6ea5" />
  <text class="t-mark" x="726" y="220" text-anchor="middle">b</text>
  <text class="t-box" x="750" y="221">中和挥发出的乙酸</text>
  <circle cx="726" cy="274" r="12" fill="#3f6ea5" />
  <text class="t-mark" x="726" y="278" text-anchor="middle">c</text>
  <text class="t-box" x="750" y="279">降低乙酸乙酯溶解度</text>
  <path d="M716 316 L908 316" stroke="#d9d3c5" stroke-width="1.2" />
  <text class="t-hint warndark" x="716" y="340">不能用 NaOH 溶液：</text>
  <text class="t-hint warndark" x="716" y="358">会让乙酸乙酯大量水解</text>

  <path d="M36 476 L924 476" stroke="#d9d3c5" stroke-width="1.2" stroke-dasharray="4 4" />

  <circle cx="52" cy="506" r="10" fill="#3f6ea5" />
  <text class="t-mark" x="52" y="510" text-anchor="middle">1</text>
  <text class="t-leg" x="72" y="502">加药序必须是<tspan class="t-legb">乙醇 → 浓硫酸 → 乙酸</tspan>：先乙醇后硫酸可防局部过热</text>
  <text class="t-leg" x="72" y="522">与酸催化脱水成醚；浓硫酸在此<tspan class="t-legb">既催化又吸水</tspan>，促使平衡正移。</text>

  <circle cx="52" cy="546" r="10" fill="#b0413e" />
  <text class="t-mark" x="52" y="550" text-anchor="middle">2</text>
  <text class="t-leg" x="72" y="542">若把导管插入液面下：停止加热后溶液冷却、气体收缩，液体沿导管<tspan class="t-legb">倒吸</tspan>进灼热烧瓶。</text>
  <text class="t-leg" x="72" y="562">本装置<tspan class="t-legb">不用温度计</tspan>——与制乙烯（插液面控 170 ℃）正好相反，两套装置口径互换是高频设错点。</text>
</svg>
