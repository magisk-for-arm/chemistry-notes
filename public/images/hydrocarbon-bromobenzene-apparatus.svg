<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" width="700" height="292" role="img" aria-label="溴苯制备装置：苯与液溴在铁粉催化下于圆底烧瓶中反应，长直导管兼作冷凝回流并导出气体，先经四氯化碳洗气瓶除去混出的溴蒸气，再通入硝酸银溶液，析出淡黄色溴化银沉淀。">
  <style>
    .bg { fill: #fbfaf7; }
    .frame { fill: none; stroke: #d9d3c5; stroke-width: 1.5; }
    .t-title { font: 700 17px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b2530; }
    .t-sub { font: 400 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .t-lab { font: 600 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2b3742; }
    .t-key { font: 700 11px/1 "Helvetica Neue", Helvetica, Arial, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8c2f2c; }
    .glass { fill: #ffffff; stroke: #2b3742; stroke-width: 2.4; stroke-linejoin: round; }
    .glassout { fill: none; stroke: #2b3742; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .gastube { fill: none; stroke: #4a6b8a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .lead { fill: none; stroke: #b0413e; stroke-width: 1.3; }
    .soln { fill: #e8b06a; }
    .sed { fill: #e8d9a0; }
    .agbr { fill: #e8cf6a; }
  </style>
  <defs>
    <clipPath id="fB"><circle cx="110" cy="196" r="46" /></clipPath>
    <clipPath id="wB"><rect x="286" y="176" width="62" height="82" /></clipPath>
    <clipPath id="aB"><rect x="470" y="176" width="56" height="82" /></clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="700" height="292" />
  <rect class="frame" x="0.75" y="0.75" width="698.5" height="290.5" rx="8" />

  <text class="t-title" x="28" y="36">苯 + 液溴 → 溴苯</text>
  <text class="t-sub" x="28" y="55">用液溴不用溴水（苯与溴水只萃取）；验 HBr 前先用 CCl₄ 洗掉混出的溴蒸气</text>

  <!-- 发生装置：圆底烧瓶 -->
  <circle class="glass" cx="110" cy="196" r="46" />
  <g clip-path="url(#fB)"><rect class="soln" x="64" y="204" width="92" height="38" /></g>
  <circle class="glassout" cx="110" cy="196" r="46" />
  <path class="glassout" d="M102 156 L102 116" />
  <path class="glassout" d="M118 156 L118 116" />
  <path class="glassout" d="M96 116 L124 116" />
  <circle cx="94" cy="210" r="3" fill="#4a4a42" />
  <circle cx="110" cy="206" r="3" fill="#4a4a42" />
  <circle cx="126" cy="211" r="3" fill="#4a4a42" />
  <path class="lead" d="M162 202 L132 206" />
  <text class="t-lab" x="168" y="206">铁粉</text>

  <!-- 长直导管：兼作冷凝回流 -->
  <path class="gastube" d="M110 116 L110 78 L298 78 L298 240" />
  <path class="lead" d="M146 100 L120 100" />
  <text class="t-lab" x="152" y="104">长直导管兼作冷凝回流</text>

  <!-- CCl4 洗气瓶：进气管插液面下 -->
  <rect class="glass" x="286" y="176" width="62" height="82" rx="4" />
  <g clip-path="url(#wB)"><rect class="sed" x="286" y="214" width="62" height="44" /></g>
  <rect class="glassout" x="286" y="176" width="62" height="82" rx="4" />
  <path class="glassout" d="M336 176 L336 146" />
  <text class="t-lab" x="358" y="192">CCl₄ 洗气</text>
  <text class="t-key" x="358" y="209">除溴蒸气</text>

  <!-- 导入 AgNO3 溶液：末端插液面下 -->
  <path class="gastube" d="M336 146 L490 146 L490 232" />
  <rect class="glass" x="470" y="176" width="56" height="82" rx="4" />
  <rect class="soln" x="474" y="212" width="48" height="42" fill="#dbeaf6" />
  <g clip-path="url(#aB)"><rect x="474" y="212" width="48" height="42" fill="#dbeaf6" /></g>
  <rect class="glassout" x="470" y="176" width="56" height="82" rx="4" />
  <circle class="agbr" cx="486" cy="246" r="2.8" />
  <circle class="agbr" cx="500" cy="240" r="2.8" />
  <circle class="agbr" cx="510" cy="248" r="2.8" />
  <text class="t-lab" x="538" y="192">AgNO₃ 溶液</text>
  <text class="t-key" x="538" y="209">淡黄色 AgBr 沉淀</text>
</svg>
